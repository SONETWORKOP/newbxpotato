name = "Newbxpotato"
version = [1, 0, 1]
min_supported_mc_version = [1, 26, 30]
description = '''
§c%w
§7- Lightweight custom clouds, aurora, waves and reflections!
%v
§3Newbxpotato
''' # %w = patch warning, %v = version
authors = ["Shivam"]
url = ""
uuid = "27b48602-932b-4de3-8dec-fa521e29d300" # Newbxpotato pack UUID
materials = ["Sky", "RenderChunk", "Actor", "ActorGlint", "EndSky", "Clouds", "SunMoon", "Weather", "ItemInHandTextured", "ItemInHandColor", "ItemInHandColorGlint", "Stars"]

